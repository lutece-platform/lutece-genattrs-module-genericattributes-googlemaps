<#assign gmapId = (idName)!(entry.idEntry?c) />
<@input type='hidden' id='${gmapId}_map_provider' name='${gmapId}_map_provider' value='${entry.mapProvider.key}' />
<div class="form-element" id="${gmapId}_waiting" style="display:none;">
 	#i18n{module.genericattributes.googlemaps.loading}
</div>
<div id="${gmapId}_gmap" style="width:45%; height:300px; border:1px solid black;margin:5px 0;"></div>
<script type="text/javascript" src="js/plugins/genericattributes/modules/googlemaps/genericattributes_gmap.js"></script>
<script type="text/javascript">
document.addEventListener( 'DOMContentLoaded', function( )
{
    var idEntry = '${gmapId}';
    var address = document.getElementById( idEntry + '_address' );

    <#-- set the coordinates back to zero as soon as the address is edited -->
    if ( address )
    {
        address.addEventListener( 'change', function( )
        {
            document.getElementById( idEntry + '_x' ).value = 0;
            document.getElementById( idEntry + '_y' ).value = 0;
        } );

        address.addEventListener( 'keypress', function( event )
        {
            if ( event.key === 'Enter' )
            {
                event.preventDefault( );
                var button = document.getElementById( idEntry + '_gmap_button' );
                if ( button )
                {
                    button.click( );
                }
            }
        } );
    }

    gmap_load( '${(entry.mapProvider.apiKey!'')?js_string}', function( )
    {
        gmap_genericattributes( 0, 0, idEntry, "#i18n{module.genericattributes.googlemaps.button_address}" );
    } );
} );
</script>
<noscript>#i18n{module.genericattributes.googlemaps.javascript.disabled}</noscript>
